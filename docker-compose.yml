services:
  # OHIF Viewer service (main viewer)
  # BIND_HOST accepts a plain IP (e.g. 127.0.0.1 or ::1) in .env or the shell.
  # Unset/empty preserves the container runtime's default published-port binding.
  # See docs/security/restrict-to-localhost.md.
  viewer:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-viewer:${VIEWER_TAG:-2.2.0}
    container_name: odelia-viewer
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/app-config.js:/usr/share/nginx/html/app-config.js
 #     - ./logs/nginx:/var/log/nginx
    ports:
      - target: 8081
        published: "8081"
        host_ip: "${BIND_HOST:-}"
    depends_on:
      - orthanc-viewer
      - keycloak
    networks:
      - odelia-network
    environment:
      - PUBLIC_URL=/
      - PORT=8081
    user: "nginx:nginx"

  # Orthanc Viewer service (for OHIF to connect to)
  orthanc-viewer:
    build:
      context: ./orthanc/viewer
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-orthanc-viewer:${TAG:-0.1.0}
    hostname: orthanc-viewer
    container_name: odelia-orthanc-viewer
    volumes:
      - ./orthanc/viewer/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/viewer/router.py:/python/router.py:ro
      - ./orthanc/viewer/feedback_routes.py:/python/feedback_routes.py:ro
      - ./orthanc/viewer/feedback_db.py:/python/feedback_db.py:ro
      - ./orthanc/viewer/host_allowlist.py:/python/host_allowlist.py:ro
      - ./orthanc/viewer/ups:/python/ups:ro
      - ./volumes/orthanc-viewer-db/:/var/lib/orthanc/db/
      - ./volumes/feedback-db/:/var/lib/odelia-feedback/
    restart: unless-stopped
    depends_on:
      - keycloak
    networks:
      - odelia-network
    ports:
      - target: 8042 # HTTP port
        published: "8000"
        host_ip: "${BIND_HOST:-}"
      - target: 4242 # DICOM port
        published: "2000"
        host_ip: "${BIND_HOST:-}"
    environment:
      - ROUTER_HOST_ALLOWLIST=${ROUTER_HOST_ALLOWLIST:-}
      - ORTHANC__NAME=orthanc-viewer
      - VERBOSE_ENABLED=true
      - VERBOSE_STARTUP=true
      - ORTHANC__PYTHON_SCRIPT=/python/router.py
      - ORTHANC__PYTHON_VERBOSE=true
      - ORTHANC_FEEDBACK_DB_DIR=/var/lib/odelia-feedback
      - ORTHANC_FEEDBACK_ENABLE_WAL=1

  # Orthanc Router service for MST AI model
  orthanc-router-mst:
    build:
      context: ./orthanc/router
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-orthanc-router:${TAG:-0.1.0}
    hostname: orthanc-router-mst
    container_name: odelia-orthanc-router-mst
    volumes:
      - ./config/orthanc-router.json:/etc/orthanc/orthanc.json:ro
      - ./volumes/orthanc-router-mst-db/:/var/lib/orthanc/db/
      - ./orthanc/router/server.py:/python/server.py
      - ./orthanc/MLIntegration/MST-classification/manifest.json:/etc/orthanc/manifest.json:ro
    restart: unless-stopped
    networks:
      - odelia-network
    ports:
      - target: 4242 # DICOM port (avoid conflict)
        published: "4243"
        host_ip: "${BIND_HOST:-}"
      - target: 8042 # HTTP port (avoid conflict)
        published: "8043"
        host_ip: "${BIND_HOST:-}"
    environment:
      - ROUTER_HOST_ALLOWLIST=${ROUTER_HOST_ALLOWLIST:-}
      - ORTHANC__NAME=orthanc-router-mst
      - VERBOSE_ENABLED=true
      - VERBOSE_STARTUP=true
      - ORTHANC__PYTHON_SCRIPT=/python/server.py
      - ORTHANC__PYTHON_VERBOSE=true
      - MODEL_BACKEND_URL=http://mst-classifier:5556
    depends_on:
      - mst-classifier

  # MST Classification Model
  mst-classifier:
    build:
      context: ./orthanc/MLIntegration
      dockerfile: MST-classification/Dockerfile
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-model-mst:${TAG:-0.1.0}
    container_name: odelia-model-mst
    environment:
      ROUTER_HOST_ALLOWLIST: "${ROUTER_HOST_ALLOWLIST:-}"
      ORTHANC_URL: "http://orthanc-router-mst:8042"
      IMAGE_FOLDER: "/app/mst-service/images"
      MODEL_PATH: "/app/mst-service/mst_model"
    networks:
      - odelia-network
    ports:
      - target: 5556
        published: "5556"
        host_ip: "${BIND_HOST:-}"

  # Orthanc Router service for MedGemma AI model
  orthanc-router-medgemma:
    build:
      context: ./orthanc/router
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-orthanc-router:${TAG:-0.1.0}
    hostname: orthanc-router-medgemma
    container_name: odelia-orthanc-router-medgemma
    volumes:
      - ./config/orthanc-router.json:/etc/orthanc/orthanc.json:ro
      - ./volumes/orthanc-router-medgemma-db/:/var/lib/orthanc/db/
      - ./orthanc/router/server.py:/python/server.py
    restart: unless-stopped
    networks:
      - odelia-network
    ports:
      - target: 4242 # DICOM port (avoid conflict)
        published: "4244"
        host_ip: "${BIND_HOST:-}"
      - target: 8042 # HTTP port (avoid conflict)
        published: "8044"
        host_ip: "${BIND_HOST:-}"
    environment:
      - ROUTER_HOST_ALLOWLIST=${ROUTER_HOST_ALLOWLIST:-}
      - ORTHANC__NAME=orthanc-router-medgemma
      - VERBOSE_ENABLED=true
      - VERBOSE_STARTUP=true
      - ORTHANC__PYTHON_SCRIPT=/python/server.py
      - ORTHANC__PYTHON_VERBOSE=true
      - MODEL_BACKEND_URL=http://medgemma-mri:5557
      - AI_NAME=MedGemma Vision-Language Model
    depends_on:
      - medgemma-mri

  # MedGemma MRI Classification Model
  medgemma-mri:
    build:
      context: ./orthanc/MLIntegration
      dockerfile: medgemma-mri/Dockerfile
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-model-medgemma:${TAG:-0.1.0}
    container_name: odelia-model-medgemma
    environment:
      ROUTER_HOST_ALLOWLIST: "${ROUTER_HOST_ALLOWLIST:-}"
      ORTHANC_URL: "http://orthanc-router-medgemma:8042"
      IMAGE_FOLDER: "/app/medgemma-service/images"
      HF_TOKEN: "${HF_TOKEN:-}"
      NUM_SLICES: "100"
      MAX_NEW_TOKENS: "500"
      TORCH_DTYPE: "bfloat16"
    networks:
      - odelia-network
    ports:
      - target: 5557
        published: "5557"
        host_ip: "${BIND_HOST:-}"
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]

  # ODELIA classification roster (ODV-218): one router+service pair per model,
  # instantiated from docker-compose.model-template.yml. All pairs are behind
  # profile odelia-models (nothing default-on): docker compose --profile odelia-models up
