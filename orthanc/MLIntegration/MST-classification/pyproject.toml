[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-mst-classification"
version = "0.1.0"
description = "MST classification service for Odelia ML Integration"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.2",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "transformers @ git+https://github.com/huggingface/transformers.git@52b82b299171721fbe7b04fe056187f7aed2e2cc",
  "huggingface-hub==1.15.0",
  "pydicom==3.0.2",
  "nibabel==5.4.2",
  "numpy==2.2.6",
  "requests==2.34.2",
  "dicomweb-client==0.61.0",
  "Pillow==12.2.0",
  "matplotlib==3.10.9",
  "opencv-python-headless==4.13.0.92",
  "scipy==1.15.3",
  "torchio==1.2.0",
  "einops==0.8.2",
  "x-transformers==2.19.6",
  "SimpleITK==2.5.5",
  "timm==1.0.27",
  "fvcore==0.1.5.post20221221",
  "omegaconf==2.3.0",
]

[tool.setuptools.packages.find]
include = []
