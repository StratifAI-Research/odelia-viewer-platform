[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-odelia-classification"
version = "0.1.0"
description = "Generalized ODELIA model service (build any model by MODEL_NAME)"
requires-python = ">=3.10"
# ODV-214: pinned to MediSwarm's validated stack (numpy<2 / monai 1.4 / torch
# 2.2) because the vendored models under mediswarm/ require it. This service is
# an independent serving container and deliberately uses an OLDER generation
# than the numpy-2 viewer/orthanc code. Keep in lockstep with requirements.txt.
dependencies = [
  # MediSwarm model stack (must match the vendored models)
  "torch==2.2.2",
  "torchvision==0.17.2",
  "numpy==1.26.4",
  "monai==1.4.0",
  "pytorch-lightning==2.4.0",
  "torchmetrics==1.7.1",
  "torchio==0.20.1",
  "einops==0.8.0",
  "x-transformers==2.3.5",
  "timm==1.0.15",
  # serving / DICOM stack
  "Flask==3.1.3",
  "Flask-Cors==6.0.2",
  "huggingface-hub==0.29.3",
  "pydicom==3.0.1",
  "nibabel==5.3.2",
  "requests==2.32.3",
  "dicomweb-client==0.61.0",
  "Pillow==11.0.0",
  "scipy==1.15.3",
  "SimpleITK==2.4.0",
]

[tool.setuptools.packages.find]
include = []
