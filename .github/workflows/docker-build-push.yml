name: Docker Build and Push

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: odelia-orthanc-viewer
            context: ./orthanc/viewer
            dockerfile: ./orthanc/viewer/Dockerfile
          - image: odelia-orthanc-router
            context: ./orthanc/router
            dockerfile: ./orthanc/router/Dockerfile
          - image: odelia-mst-classifier
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/MST-classification/Dockerfile
          - image: odelia-medgemma-mri
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/medgemma-mri/Dockerfile
          - image: odelia-chat-middleware
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/chat-middleware/Dockerfile
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub (push events only)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: stratifai/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push on push events)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
