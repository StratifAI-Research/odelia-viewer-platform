[tool.pytest.ini_options]
testpaths = [
  "tests"
]
addopts = "-q"


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__pycache__", ".pytest_cache", ".venv", "tests", "sample_data", "screenshots", "*.ipynb"]

[tool.ruff.lint]
# ODV-199 acceptance criteria
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RET", "PTH", "RUF"]
extend-select = ["ANN"]
ignore = [
  "ANN401",  # Any-typed allowed during ODV-195 migration; remove this after
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"MLIntegration/*/app*.py" = ["ANN201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["viewer.*", "router.*", "MLIntegration.shared.*"]
strict = true
