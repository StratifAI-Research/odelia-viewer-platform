  # Chat Middleware - WebSocket-based chat for DICOM study analysis
  # Supports two backends: Ollama (default) and llama.cpp (optional).
  # Override via .env or shell: BACKEND_TYPE=llamacpp OLLAMA_URL=http://llamacpp-server:8090
  chat-middleware:
    build:
      context: ./orthanc/MLIntegration
      dockerfile: chat-middleware/Dockerfile
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-chat:${TAG:-0.1.0}
    container_name: odelia-chat
    environment:
      CHAT_ALLOWED_ORIGINS: "${CHAT_ALLOWED_ORIGINS:-}"
      CHAT_WEBSOCKET_ORIGIN_CHECK: "${CHAT_WEBSOCKET_ORIGIN_CHECK:-0}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-thiagomoraes/medgemma-1.5-4b-it:F16}"
      BACKEND_TYPE: "${BACKEND_TYPE:-ollama}"
      OLLAMA_NUM_CTX: "128000"  # 128k context window
      # Optional hosted cloud backend, off unless an operator opts in.
      #
      # Enabling it lets chat users route a study to a hosted model, which means
      # the preprocessed DICOM slices leave this network and are sent to a third
      # party. Keep it disabled for any deployment holding patient data.
      # See docs/setup/setup_chat.md.
      #
      # CLOUD_PROVIDER picks which service the cloud slot points at — "ollama"
      # (Ollama Cloud) or "openrouter". Only that provider's own variables are
      # read, so the two sets can sit side by side in .env.
      ALLOW_CLOUD_BACKEND: "${ALLOW_CLOUD_BACKEND:-0}"
      CLOUD_PROVIDER: "${CLOUD_PROVIDER:-ollama}"
      OLLAMA_CLOUD_URL: "${OLLAMA_CLOUD_URL:-https://ollama.com}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      OLLAMA_CLOUD_MODEL: "${OLLAMA_CLOUD_MODEL:-}"
      OPENROUTER_URL: "${OPENROUTER_URL:-https://openrouter.ai/api}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      # OpenRouter brokers each request to one of several inference providers.
      # Left unset, routing is restricted to providers that do not retain or train
      # on prompts; setting it to 1 lifts that restriction.
      OPENROUTER_ALLOW_DATA_COLLECTION: "${OPENROUTER_ALLOW_DATA_COLLECTION:-0}"
      # Optional comma-separated substrings narrowing the cloud model menu.
      # OpenRouter lists several hundred models; most deployments want a handful.
      CLOUD_MODEL_FILTER: "${CLOUD_MODEL_FILTER:-}"
      WADO_BASE_URL: "http://orthanc-viewer:8042/dicom-web"
      NUM_SLICES: "5"
      MAX_CACHE_ENTRIES: "100"
    networks:
      - odelia-network
    ports:
      - target: 5560
        published: "5560"
        host_ip: "${BIND_HOST:-}"
    depends_on:
      - orthanc-viewer
    # Enable host.docker.internal on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # llama.cpp server - optional alternative to Ollama for the Chat AI.
  # Only starts when the "llamacpp" profile is activated:
  #   docker compose --profile llamacpp up -d llamacpp-server chat-middleware
  # Requires GGUF model files in ./volumes/models/ (see README for download instructions).
  llamacpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [llamacpp]
    container_name: odelia-llamacpp-server
    volumes:
      - ./volumes/models:/models:ro
    ports:
      - target: 8090
        published: "8090"
        host_ip: "${BIND_HOST:-}"
    networks:
      - odelia-network
    restart: unless-stopped
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
      - -m
      - /models/${GGUF_MODEL_FILE:-medgemma-1.5-4b-it-BF16.gguf}
      - --mmproj
      - /models/${MMPROJ_FILE:-mmproj-BF16.gguf}
      - -c
      - "${LLAMA_CTX_SIZE:-131072}"
      - -ngl
      - "${LLAMA_N_GPU_LAYERS:-99}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Grafana for feedback analytics (reads SQLite via plugin)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: odelia-grafana
    ports:
      - target: 3000
        published: "3000"
        host_ip: "${BIND_HOST:-}"
    user: "0:0"                          # run as root
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-odelia}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./volumes/feedback-db/:/var/lib/odelia-feedback/
    depends_on:
      - orthanc-viewer
    networks:
      - odelia-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: 'start-dev --import-realm'
    hostname: keycloak
    container_name: keycloak
    volumes:
      - ./config/ohif-keycloak-realm.json:/opt/keycloak/data/import/ohif-keycloak-realm.json
    environment:
      # Database
      KC_DB_URL_HOST: postgres
      KC_DB: postgres
      KC_DB_URL: 'jdbc:postgresql://postgres:5432/keycloak'
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
      KC_HOSTNAME_ADMIN_URL: http://localhost:8081/keycloak/
      KC_HOSTNAME_URL: http://localhost:8081/keycloak/
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_JDBC_PARAMS: connectTimeout=40000
      KC_LOG_LEVEL: INFO
      KC_HOSTNAME_DEBUG: "true"
      # added later
      PROXY_ADDRESS_FORWARDING: "true"
    ports:
      - target: 8080
        published: "8080"
        host_ip: "${BIND_HOST:-}"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - odelia-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:15
    hostname: postgres
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
    restart: unless-stopped
    networks:
      - odelia-network

volumes:
  postgres_data:
    driver: local

networks:
  odelia-network:
    driver: bridge
    driver_opts:
      # Docker defaults every bridge to 1500, which is wrong whenever the host's
      # own uplink is smaller -- notably WSL2, where eth0 is commonly 1420. The
      # containers then emit packets the path cannot carry, and because Path MTU
      # Discovery depends on ICMP getting back, the failure is intermittent: it
      # strands the TLS handshake (OpenSSL 3.5 sends a ~1.5 KB ClientHello) and
      # clears again whenever the kernel's PMTU cache is repopulated, expiring
      # every net.ipv4.route.mtu_expires seconds (600 by default).
      #
      # Left at 1500 so ordinary Linux hosts are unaffected. On WSL2 set
      # DOCKER_MTU to match `ip link show eth0`:
      #   echo 'DOCKER_MTU=1420' >> .env && docker compose down && docker compose up -d
      # (the network is only reconfigured when it is recreated).
      com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}"
