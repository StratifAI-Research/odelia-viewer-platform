[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "unit: fast tests with no external services; default CI run",
  "integration: tests requiring a live Orthanc instance (skipped automatically if unreachable)",
]


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__pycache__", ".pytest_cache", ".venv", "tests", "sample_data", "screenshots", "*.ipynb"]

[tool.ruff.lint]
# ODV-199 acceptance criteria
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RET", "PTH", "RUF"]
# ODV-195 acceptance criteria
extend-select = ["UP006", "UP007", "ANN"]
ignore = [
  "ANN401",  # Any-typed allowed during ODV-195 migration; remove this after
  "E501",    # line length enforced by formatter
]

[tool.ruff.lint.isort]
# `orthanc` is the plugin API module the Orthanc server injects into the plugin
# process at runtime, so it is third-party to this repo -- but there is no
# `orthanc` package on disk to say so, and ruff infers first-party membership by
# looking for the module under `src` (which is this directory). Any directory
# named `orthanc` appearing here therefore reclassifies every `import orthanc` in
# the repo and fires I001 on files nobody touched. Stray tool caches do exactly
# that. State the classification instead of leaving it to the filesystem.
known-third-party = ["orthanc"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"MLIntegration/*/app*.py" = ["ANN201"]
# Ported ODELIA challenge model definitions (ODV-214): faithfully reproduced from
# MediSwarm to preserve state_dict layout. Keep the bug-catching rules but relax
# annotation / naming / copied-text-unicode / pathlib churn on this research code.
# One entry per vendored arch module (the subunit loader.py files are ours and
# stay strict).
"MLIntegration/*/models/agaldran/model_factory.py" = ["ANN", "N", "RUF001", "RUF002", "RUF003", "PTH"]
"MLIntegration/*/models/bcn_aim/swinunetr.py" = ["ANN", "N", "RUF001", "RUF002", "RUF003", "PTH"]
"MLIntegration/*/models/divide_and_conquer/model.py" = ["ANN", "N", "RUF001", "RUF002", "RUF003", "PTH"]
"MLIntegration/*/models/lme_abmil/model.py" = ["ANN", "N", "RUF001", "RUF002", "RUF003", "PTH"]
"MLIntegration/*/models/pimed/model.py" = ["ANN", "N", "RUF001", "RUF002", "RUF003", "PTH"]
# Orthanc REST callbacks use PascalCase to match the Orthanc plugin convention
# (RegisterRestCallback handlers) and the DICOM UPS-RS operation names.
"viewer/router.py" = ["N802"]
"router/ups/routes.py" = ["N802"]
"viewer/feedback_routes.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["viewer.*", "router.*", "MLIntegration.shared.*"]
strict = true

# Tests are exempt from strict typing (mirrors the ruff "tests/**" ANN exemption).
[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
