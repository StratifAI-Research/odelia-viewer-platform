services:
  # OHIF Viewer service (main viewer)
  # ${BIND_HOST:-} prefix lets operators restrict every published port to
  # localhost by setting BIND_HOST=127.0.0.1: (note trailing colon) in .env
  # or the shell. Empty default preserves LAN-shared 0.0.0.0 binding.
  # See docs/restrict-to-localhost.md.
  viewer:
    image: ${VIEWER_IMAGE:-stratifai/odelia-viewer:${VIEWER_TAG:-2.3.0@sha256:8fee8d3ab400342e3c31ba9648dda4b7bf698657c8a7ae0ab7060222bd416647}}
    container_name: odelia-viewer
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/app-config.js:/usr/share/nginx/html/app-config.js
 #     - ./logs/nginx:/var/log/nginx
    ports:
      - '${BIND_HOST:-}8081:8081'
    depends_on:
      - orthanc-viewer
      - keycloak
    networks:
      - odelia-network
    environment:
      - PUBLIC_URL=/
      - PORT=8081
    user: "nginx:nginx"

  # Orthanc Viewer service (for OHIF to connect to)
  orthanc-viewer:
    build:
      context: ./orthanc/viewer
      dockerfile: Dockerfile
    image: ${ORTHANC_VIEWER_IMAGE:-stratifai/odelia-orthanc-viewer:${TAG:-latest@sha256:3b0ce82ddc4bfb19e3e84e36a80719fc0ab8fcdb44caa2c81f61d623caf63fb1}}
    hostname: orthanc-viewer
    container_name: odelia-orthanc-viewer
    volumes:
      - ./orthanc/viewer/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/viewer/router.py:/python/router.py:ro
      - ./orthanc/viewer/feedback_routes.py:/python/feedback_routes.py:ro
      - ./orthanc/viewer/feedback_db.py:/python/feedback_db.py:ro
      - ./orthanc/viewer/host_allowlist.py:/python/host_allowlist.py:ro
      - ./orthanc/viewer/ups:/python/ups:ro
      - ./volumes/orthanc-viewer-db/:/var/lib/orthanc/db/
      - ./volumes/feedback-db/:/var/lib/odelia-feedback/
    restart: unless-stopped
    depends_on:
      - keycloak
    networks:
      - odelia-network
    ports:
      - '${BIND_HOST:-}8000:8042' # HTTP port
      - '${BIND_HOST:-}2000:4242' # DICOM port
    environment:
      - ORTHANC__NAME=orthanc-viewer
      - VERBOSE_ENABLED=true
      - VERBOSE_STARTUP=true
      - ORTHANC__PYTHON_SCRIPT=/python/router.py
      - ORTHANC__PYTHON_VERBOSE=true
      - ORTHANC_FEEDBACK_DB_DIR=/var/lib/odelia-feedback
      - ORTHANC_FEEDBACK_ENABLE_WAL=1

  # Trained MST swarm May 2026; keep the existing router address for saved clients.
  orthanc-router-mst:
    build:
      context: ./orthanc/router
      dockerfile: Dockerfile
    image: ${ORTHANC_ROUTER_IMAGE:-stratifai/odelia-orthanc-router:${TAG:-latest@sha256:9ab29a10df7f8c27ae91cb1740a7b75ee1dcb91496cc41846fca485e346bb317}}
    hostname: orthanc-router-mst
    container_name: odelia-orthanc-router-mst
    volumes:
      - ./config/orthanc-router.json:/etc/orthanc/orthanc.json:ro
      - ./volumes/orthanc-router-mst-db/:/var/lib/orthanc/db/
      - ./orthanc/router/server.py:/python/server.py
      - ./orthanc/MLIntegration/odelia-classification/manifest.json:/etc/orthanc/manifest.json:ro
    restart: unless-stopped
    networks:
      - odelia-network
    ports:
      - '${BIND_HOST:-}4243:4242' # DICOM port (avoid conflict)
      - '${BIND_HOST:-}8043:8042' # HTTP port (avoid conflict)
    environment:
      - ORTHANC__NAME=orthanc-router-mst
      - VERBOSE_ENABLED=true
      - VERBOSE_STARTUP=true
      - ORTHANC__PYTHON_SCRIPT=/python/server.py
      - ORTHANC__PYTHON_VERBOSE=true
      - MODEL_BACKEND_URL=http://odelia-classification-mst:5556
      - AI_NAME=MST swarm May 2026
    depends_on:
      odelia-classification-mst:
        condition: service_healthy

  # Prebuilt trained image: no HF credentials or fallback weights at runtime.
  odelia-classification-mst:
    image: ${MST_IMAGE:-stratifai/odelia-classification-mst@sha256:4e0ffc4c72db7cbe87ec64aa90c131bbd8df224fbfb76ea41c4e5a39d35592ab}
    container_name: odelia-classification-mst
    restart: unless-stopped
    environment:
      ORTHANC_URL: "http://orthanc-router-mst:8042"
      IMAGE_FOLDER: "/app/odelia-service/images"
      MODEL_DEVICE: "${MODEL_DEVICE:-cpu}"
      ALLOW_INIT_WEIGHTS: "0"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    networks:
      - odelia-network
    ports:
      - '${BIND_HOST:-}5556:5556'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5556/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Trained swarm roster: default-on router/service pairs registered in
