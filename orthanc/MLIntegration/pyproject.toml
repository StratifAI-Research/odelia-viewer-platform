[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration"
version = "2.0.0"
description = "ML Integration services for DICOM analysis"
readme = "README_REFACTORED.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "torch>=1.9.0",
    "torchio>=0.18.0",
    "pydicom>=2.0.0",
    "requests>=2.25.0",
    "numpy>=1.20.0",
    "SimpleITK>=2.0.0",
    "monai>=0.8.0",
    "huggingface-hub>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.10.0",
]

[tool.setuptools.packages.find]
include = ["shared", "shared.*"]

