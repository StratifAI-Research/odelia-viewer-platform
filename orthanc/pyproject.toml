[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "unit: fast tests with no external services; default CI run",
  "integration: tests requiring a live Orthanc instance (skipped automatically if unreachable)",
]


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__pycache__", ".pytest_cache", "tests", "sample_data", "screenshots", "*.ipynb"]

[tool.ruff.lint]
# ODV-199 acceptance criteria
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RET", "PTH", "RUF"]
# ODV-195 acceptance criteria
extend-select = ["UP006", "UP007", "ANN"]
ignore = [
  "ANN401",  # Any-typed allowed during ODV-195 migration; remove this after
  "E501",    # line length enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"MLIntegration/*/app*.py" = ["ANN201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["viewer.*", "router.*", "MLIntegration.shared.*"]
strict = true

[[tool.mypy.overrides]]
module = [
  "MLIntegration.medgemma_mri.*",
  "MLIntegration.MST_classification.*",
  "MLIntegration.chat_middleware.*",
  "MLIntegration.breast_cancer_classification.*",
]
ignore_errors = true
