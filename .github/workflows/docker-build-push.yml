name: Docker Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Versioned releases come from this button, not from a pushed git tag. A tag
  # can point at any commit, including unreviewed work, and a tag-triggered run
  # executes the workflow file from that same commit -- so an in-workflow guard
  # could simply be deleted by whoever cut the tag. The `release` environment
  # below admits only refs on main, which closes that path in GitHub itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 2.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Docker Hub credentials are environment secrets on `release`, which is
    # restricted to the main branch. Anyone may open a PR or press the release
    # button; only reviewed main code is ever handed the token.
    #
    # Conditional because this job also runs on pull requests, where it only
    # builds (push: false). A PR ref is not main, so requesting the environment
    # there would be denied and fail the job; an empty name means "no
    # environment", which is what a PR build wants.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # cache_scope equals `image` for every leg here (none write a shared
        # scope), so cache-from lists the same scope twice. Kept on every
        # entry anyway for uniformity with build-preview, where cache_scope
        # differs from image for the shared classification legs.
        include:
          - image: odelia-orthanc-viewer
            context: ./orthanc/viewer
            dockerfile: ./orthanc/viewer/Dockerfile
            cache_scope: odelia-orthanc-viewer
            cache_to: type=gha,mode=max,scope=odelia-orthanc-viewer
          - image: odelia-orthanc-router
            context: ./orthanc/router
            dockerfile: ./orthanc/router/Dockerfile
            cache_scope: odelia-orthanc-router
            cache_to: type=gha,mode=max,scope=odelia-orthanc-router
          - image: odelia-model-mst
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/MST-classification/Dockerfile
            cache_scope: odelia-model-mst
            cache_to: type=gha,mode=max,scope=odelia-model-mst
          - image: odelia-model-medgemma
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/medgemma-mri/Dockerfile
            cache_scope: odelia-model-medgemma
            cache_to: type=gha,mode=max,scope=odelia-model-medgemma
          - image: odelia-chat
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/chat-middleware/Dockerfile
            cache_scope: odelia-chat
            cache_to: type=gha,mode=max,scope=odelia-chat
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub (publishing events only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Build phase pushes ONLY the immutable per-commit SHA tag. The mutable
      # latest/semver tags are promoted in a separate job that needs: build,
      # so latest never advances unless all five publishing legs succeed.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: stratifai/${{ matrix.image }}
          tags: |
            type=sha,format=long

      - name: Build (and push SHA tag when publishing)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ matrix.cache_to }}

  # Preview roster (ODV-218): six odelia-classification-* images with init-only
  # weights (no trained checkpoint yet, ODV-216). Built on every push/PR to catch
  # breakage, but never pushed and never gates promote -- a broken preview model
  # must not block latest/semver from advancing for the five publishing images.
  build-preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: odelia-classification-agaldran
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=agaldran
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-agaldran
          - image: odelia-classification-bcn-aim
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=BCN_AIM
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-bcn-aim
          - image: odelia-classification-divide-and-conquer
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=DivideAndConquer
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-divide-and-conquer
          - image: odelia-classification-lme-abmil
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=LME_ABMIL
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-lme-abmil
          - image: odelia-classification-mst
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=MST
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-mst
          - image: odelia-classification-pimed
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=Pimed
            cache_scope: odelia-classification-shared
            # Sole writer of the shared scope. The writer is arbitrary -- the
            # reusable layers are everything before `RUN test -n "$MODEL"`,
            # the first instruction after ARG MODEL comes into scope, which is
            # where the cache first diverges; the DINOv2 pre-cache step runs
            # after that point and is irrelevant to this choice.
            cache_to: |
              type=gha,mode=max,scope=odelia-classification-pimed
              type=gha,mode=max,scope=odelia-classification-shared
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: stratifai/${{ matrix.image }}
          tags: |
            type=sha,format=long

      - name: Build (never pushed -- init-only preview roster)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=${{ matrix.cache_scope }}
          # Shared classification cache only helps runs AFTER a requirements.txt
          # change lands, since the six matrix jobs run in parallel this run.
          cache-to: ${{ matrix.cache_to }}

  # Atomic-ish promotion: only runs once every publishing build leg succeeds,
  # so a partial build failure can never leave latest/semver split across
  # commits. Re-tags the already-pushed SHA manifests (no rebuild / no pull)
  # via imagetools. Gates on the publishing `build` job only -- preview
  # models (build-preview) are deliberately excluded, since they are never
  # pushed and have no SHA manifest to promote.
  promote:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Promote SHA-tagged images to latest / semver
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # odelia-classification-* omitted: they build in build-preview, are
          # never pushed, and so have no SHA manifest to promote.
          images="odelia-orthanc-viewer odelia-orthanc-router odelia-model-mst odelia-model-medgemma odelia-chat"
          tags=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            v="${VERSION#v}"             # tolerate a typed-in "v2.3.0"
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::version must look like 2.3.0 (got '${VERSION}')"; exit 1 ;;
            esac
            tags+=("$v" "${v%.*}")       # 2.3.0 and 2.3
          elif [ "$REF_NAME" = "main" ]; then
            tags+=("latest")
          fi
          if [ ${#tags[@]} -eq 0 ]; then
            echo "No promotion tags for $EVENT on $REF_NAME; skipping."
            exit 0
          fi
          for img in $images; do
            src="stratifai/${img}:sha-${SHA}"
            args=()
            for t in "${tags[@]}"; do args+=(-t "stratifai/${img}:${t}"); done
            echo "Promoting ${src} -> ${tags[*]}"
            docker buildx imagetools create "${args[@]}" "${src}"
          done
