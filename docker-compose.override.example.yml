# Run other images than the ones this checkout pins, for example a test build
# or a different trained model release. Copy this file to
# docker-compose.override.yml (gitignored); Compose merges it automatically.
# Delete that file to go back to the pinned images.
#
# Keep only the services you change and replace every <placeholder>. Use full
# image references, preferably with a digest.
services:
  # A viewer you built yourself, e.g. `docker build -t odelia-viewer:local .` in a
  # checkout of odelia-viewer. Only releases are on Docker Hub.
  viewer:
    image: odelia-viewer:local

  # Another trained model build, from the Trained model images workflow.
  odelia-classification-mst:
    image: stratifai/odelia-classification-mst@sha256:<digest>

  # The platform's own images: orthanc-viewer, chat-middleware and every
  # orthanc-router-* service (they all share one router image), e.g. to keep one
  # of them on an older release. To build them from your checkout, use
  # docker-compose.dev.yml instead.
  chat-middleware:
    image: stratifai/odelia-chat:<older-version>
