[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-medgemma-mri"
version = "0.1.0"
description = "MedGemma MRI inference service for Odelia ML Integration"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.2",
  "transformers==5.9.0",
  "accelerate==1.13.0",
  "torch==2.12.0",
  "huggingface-hub==1.15.0",
  "pydicom==3.0.2",
  "SimpleITK==2.5.5",
  "Pillow==12.2.0",
  "numpy==2.2.6",
  "requests==2.34.2",
  "dicomweb-client==0.61.0",
]

[tool.setuptools.packages.find]
include = []
