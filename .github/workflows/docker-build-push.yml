name: Docker Build and Push

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: odelia-orthanc-viewer
            context: ./orthanc/viewer
            dockerfile: ./orthanc/viewer/Dockerfile
            publish: 'yes'
            cache_scope: odelia-orthanc-viewer
            cache_to: type=gha,mode=max,scope=odelia-orthanc-viewer
          - image: odelia-orthanc-router
            context: ./orthanc/router
            dockerfile: ./orthanc/router/Dockerfile
            publish: 'yes'
            cache_scope: odelia-orthanc-router
            cache_to: type=gha,mode=max,scope=odelia-orthanc-router
          - image: odelia-model-mst
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/MST-classification/Dockerfile
            publish: 'yes'
            cache_scope: odelia-model-mst
            cache_to: type=gha,mode=max,scope=odelia-model-mst
          - image: odelia-model-medgemma
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/medgemma-mri/Dockerfile
            publish: 'yes'
            cache_scope: odelia-model-medgemma
            cache_to: type=gha,mode=max,scope=odelia-model-medgemma
          - image: odelia-chat
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/chat-middleware/Dockerfile
            publish: 'yes'
            cache_scope: odelia-chat
            cache_to: type=gha,mode=max,scope=odelia-chat
          # Generalized model service (ODV-218): one image per roster model,
          # named stratifai/odelia-classification-<model> (kebab-case subunit).
          # publish: 'no' -- init-only weights (no trained checkpoint yet, ODV-216).
          # Flips to 'yes' for a given model once that model has real weights baked in.
          - image: odelia-classification-agaldran
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=agaldran
            publish: 'no'
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-agaldran
          - image: odelia-classification-bcn-aim
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=BCN_AIM
            publish: 'no'
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-bcn-aim
          - image: odelia-classification-divide-and-conquer
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=DivideAndConquer
            publish: 'no'
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-divide-and-conquer
          - image: odelia-classification-lme-abmil
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=LME_ABMIL
            publish: 'no'
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-lme-abmil
          - image: odelia-classification-mst
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=MST
            publish: 'no'
            cache_scope: odelia-classification-shared
            cache_to: type=gha,mode=max,scope=odelia-classification-mst
          - image: odelia-classification-pimed
            context: ./orthanc/MLIntegration
            dockerfile: ./orthanc/MLIntegration/odelia-classification/Dockerfile
            build_args: |
              MODEL=Pimed
            publish: 'no'
            cache_scope: odelia-classification-shared
            # Sole writer of the shared scope: no DINOv2 pre-cache step,
            # so its layers are the common subset across all six models.
            cache_to: |
              type=gha,mode=max,scope=odelia-classification-pimed
              type=gha,mode=max,scope=odelia-classification-shared
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub (push events only)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Build phase pushes ONLY the immutable per-commit SHA tag. The mutable
      # latest/semver tags are promoted in a separate job that needs: all legs,
      # so latest never advances unless every component built successfully.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: stratifai/${{ matrix.image }}
          tags: |
            type=sha,format=long

      - name: Build (and push SHA tag on push events)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && matrix.publish == 'yes' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=${{ matrix.cache_scope }}
          # Shared classification cache only helps runs AFTER a requirements.txt
          # change lands, since the six matrix jobs run in parallel this run.
          cache-to: ${{ matrix.cache_to }}

  # Atomic-ish promotion: only runs once ALL build legs succeed, so a partial
  # build failure can never leave latest/semver split across commits. Re-tags
  # the already-pushed SHA manifests (no rebuild / no pull) via imagetools.
  promote:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Promote SHA-tagged images to latest / semver
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # odelia-classification-* omitted: init-only weights are not pushed
          # (see build job matrix.publish), so there is no SHA manifest to promote.
          images="odelia-orthanc-viewer odelia-orthanc-router odelia-model-mst odelia-model-medgemma odelia-chat"
          tags=()
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            tags+=("latest")
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"            # v2.1.0 -> 2.1.0
            tags+=("$v" "${v%.*}")       # 2.1.0 and 2.1
          fi
          if [ ${#tags[@]} -eq 0 ]; then
            echo "No promotion tags for ref $REF_NAME ($REF_TYPE); skipping."
            exit 0
          fi
          for img in $images; do
            src="stratifai/${img}:sha-${SHA}"
            args=()
            for t in "${tags[@]}"; do args+=(-t "stratifai/${img}:${t}"); done
            echo "Promoting ${src} -> ${tags[*]}"
            docker buildx imagetools create "${args[@]}" "${src}"
          done
